<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Castle Door</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Castle Door</h1>
      <p id="story">
        You stand before a quiet castle. A golden door is locked, but a small
        note says: "Choose your English word carefully."
      </p>
      <div id="choices">
        <button type="button" onclick="choose('open')">open</button>
        <button type="button" onclick="choose('sleep')">sleep</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
